name: Build iOS IPA macos-15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unsigned .app
        run: |
          cd ios/VrotApp
          xcodebuild clean build \
            -project VrotApp.xcodeproj \
            -scheme VrotApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into .ipa
        run: |
          cd ios/VrotApp
          rm -rf Payload VrotApp.ipa
          mkdir -p Payload
          cp -R build/Release-iphoneos/VrotApp.app Payload/
          rm -rf Payload/VrotApp.app/_CodeSignature
          find Payload -name ".DS_Store" -delete
          zip -r -y -X VrotApp.ipa Payload
          unzip -v VrotApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrot-ipa-macos-15
          path: ios/VrotApp/VrotApp.ipa
          retention-days: 14
