name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Build unsigned .app
        run: |
          cd ios/VrotApp
          xcodebuild clean build \
            -project VrotApp.xcodeproj \
            -scheme VrotApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package into .ipa
        run: |
          cd ios/VrotApp
          mkdir -p Payload
          cp -r build/Release-iphoneos/VrotApp.app Payload/
          zip -r VrotApp.ipa Payload
          mkdir -p ../../release
          cp VrotApp.ipa ../../release/vrot.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrot-ipa
          path: ios/VrotApp/VrotApp.ipa
          retention-days: 14
