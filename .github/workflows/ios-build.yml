name: Build VROT iOS IPA

on:
  push:
    branches: [ main, master, codex/ios-native-update ]
  workflow_dispatch:

jobs:
  build:
    # macos-15 is Apple Silicon and can remain unassigned during ARM64
    # capacity shortages. The explicit Intel label uses the standard x64 pool.
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project files
        run: xcodebuild -list -project ios/VrotApp/VrotApp.xcodeproj

      - name: Build unsigned .app
        run: |
          cd ios/VrotApp
          set -o pipefail
          xcodebuild clean build \
            -project VrotApp.xcodeproj \
            -scheme VrotApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Verify app bundle
        run: |
          test -d ios/VrotApp/build/Release-iphoneos/VrotApp.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/VrotApp/build/Release-iphoneos/VrotApp.app/Info.plist

      - name: Package unsigned test artifact
        run: |
          cd ios/VrotApp
          rm -rf Payload VrotApp.ipa
          mkdir -p Payload
          cp -R build/Release-iphoneos/VrotApp.app Payload/
          rm -rf Payload/VrotApp.app/_CodeSignature
          find Payload -name '.DS_Store' -delete
          zip -r -y -X VrotApp.ipa Payload
          unzip -t VrotApp.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrot-ios-unsigned-ipa
          path: ios/VrotApp/VrotApp.ipa
          retention-days: 14

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: vrot-ios-build-metadata
          path: |
            ios/VrotApp/build/Release-iphoneos/VrotApp.app/Info.plist
            ios/README.md
          retention-days: 14

