name: Verify iOS build (unsigned)

on:
  push:
    branches: [ main, master, codex/ios-native-update ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned .app
        run: |
          cd ios/VrotApp
          xcodebuild clean build \
            -project VrotApp.xcodeproj \
            -scheme VrotApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package unsigned test artifact
        run: |
          cd ios/VrotApp
          mkdir -p Payload
          cp -r build/Release-iphoneos/VrotApp.app Payload/
          zip -r VrotApp.ipa Payload
          mkdir -p ../../release
          cp VrotApp.ipa ../../release/vrot.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrot-unsigned-ipa-not-installable
          path: ios/VrotApp/VrotApp.ipa
          retention-days: 14

